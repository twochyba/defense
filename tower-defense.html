<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Башенная оборона</title>
<style>
:root{font:15px system-ui,Segoe UI,sans-serif;color:#edf5ee;background:#101a20}*{box-sizing:border-box}body{margin:0;padding:16px}.app{max-width:1000px;margin:auto}h1{margin:0 0 12px}.bar,.controls,.maps,.shop{display:flex;gap:9px;align-items:center;flex-wrap:wrap;padding:11px;margin:0 0 11px;background:#1b2b32;border:1px solid #354b50;border-radius:11px}.stat,.card{background:#263a40;border-radius:8px;padding:8px 10px}.spacer{flex:1}button{font:inherit;cursor:pointer;border:0;border-radius:7px;padding:8px 12px;color:#fff;background:#337c65;font-weight:700}button:disabled{opacity:.45;cursor:not-allowed}.secondary,.maps button{background:#3b5259}.maps button.selected{outline:2px solid #9be4ba}canvas{width:100%;height:auto;aspect-ratio:900/500;display:block;background:#203931;border:2px solid #45645a;border-radius:11px;touch-action:none}.shop{align-items:stretch}.shop h2{width:100%;font-size:1rem;margin:0}.card{flex:1 1 145px;min-width:140px;border:1px solid #3a5556}.card strong,.card small{display:block}.card small{color:#bacbc4;min-height:42px;margin:5px 0}.card button{width:100%;font-size:.88rem}.card button.sel{outline:2px solid #9be4ba}#hint{color:#ffda81}.overlay{position:fixed;inset:0;background:#071015df;display:none;place-items:center;padding:18px}.dialog{background:#1b3036;border:1px solid #5a796c;border-radius:14px;padding:24px;text-align:center;max-width:440px}.dialog button{background:#337c65}@media(max-width:600px){body{padding:8px}.stat{font-size:.82rem}}
</style>
</head>
<body><main class="app">
<h1>🛡️ Башенная оборона</h1>
<div class="bar"><div class="stat">🪙 Монеты: <b id="coins"></b></div><div class="stat">❤️ База: <b id="lives"></b></div><div class="stat">🌊 Волна: <b id="wave"></b></div><div class="stat">Фермы: <b id="farmCount"></b> | Слабые: <b id="weakCount"></b> | Сильные: <b id="strongCount"></b></div><span class="spacer"></span><div class="stat" id="mapLabel"></div></div>
<div class="controls"><button id="start">Старт волны</button><button id="pause" class="secondary">Пауза</button><button id="speed" class="secondary">Скорость x1</button><span class="spacer"></span><span id="hint"></span></div>
<div class="maps" id="maps"></div><canvas id="game" width="900" height="500"></canvas><section class="shop" id="shop"><h2>Магазин — выберите покупку, затем клетку на карте. Клик по своему объекту продаёт его за 60% стоимости.</h2></section></main>
<div class="overlay" id="overlay"><div class="dialog"><h2 id="resultTitle"></h2><p id="resultText"></p><button id="again">Играть снова</button></div></div>
<script>
"use strict";
// Все настройки баланса, лимиты и карты собраны в CONFIG.
const CONFIG={startCoins:100,baseLives:20,wavesPerMap:5,waveBonus:20,sellPercent:.60,grid:50,weakDpsMax:15,limits:{farm:6,weak:6,strong:4},farm:{baseCost:80,costStep:1.2,income:5,interval:3,hp:80,range:55},maps:[
 {name:"Зелёная долина",hint:"",path:[[0,250],[200,250],[200,110],[490,110],[490,370],[900,370]]},
 {name:"Каменистый перевал",hint:"",path:[[0,400],[130,400],[130,120],[320,120],[320,330],[540,330],[540,80],[740,80],[740,250],[900,250]]},
 {name:"Туманная чаща",hint:"Здесь есть невидимые враги! Нужен Дозорный",path:[[0,120],[180,120],[180,370],[400,370],[400,160],[650,160],[650,400],[900,400]]}],
 units:[
  {id:"archer",name:"Лучник",icon:"🏹",damage:10,attackSpeed:1,range:155,rate:1,cost:50,color:"#9bd46b"},
  {id:"spear",name:"Копейщик",icon:"🔱",damage:7,attackSpeed:2,range:92,rate:.5,cost:75,color:"#e4c66a"},
  {id:"watch",name:"Дозорный",icon:"👁️",damage:8,attackSpeed:1,range:145,detect:190,rate:1,cost:100,color:"#63d7d2"},
  {id:"mage",name:"Маг",icon:"🔮",damage:22,attackSpeed:1,range:135,rate:1,splash:58,cost:150,color:"#be90fa"},
  {id:"cannon",name:"Пушка",icon:"💣",damage:30,attackSpeed:1,range:175,rate:2.2,cost:220,color:"#ee936a"}],
 enemies:{normal:{hp:42,speed:43,reward:12,color:"#76c95c",armor:0},fast:{hp:30,speed:78,reward:14,color:"#e6ce63",armor:0},armored:{hp:100,speed:34,reward:22,color:"#9caeb9",armor:5},invisible:{hp:52,speed:52,reward:20,color:"#b29af0",armor:0,invisible:true}}};
const $=id=>document.getElementById(id),canvas=$("game"),ctx=canvas.getContext("2d");
let mapIndex=0,unlocked=0,coins=CONFIG.startCoins,lives=CONFIG.baseLives,wave=0,running=false,paused=false,ended=false,speed=1;
let buildings=[],enemies=[],shots=[],selected=null,hover=null,queue=[],spawnWait=0,nextId=1,resultAction=null,last=performance.now();
const path=()=>CONFIG.maps[mapIndex].path, dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y), dps=u=>u.damage*u.attackSpeed;
const category=u=>dps(u)<=CONFIG.weakDpsMax?"weak":"strong";
function pathLen(p){return p.slice(1).reduce((s,b,i)=>s+Math.hypot(b[0]-p[i][0],b[1]-p[i][1]),0)}
function pointAt(p,d){for(let i=1;i<p.length;i++){let a=p[i-1],b=p[i],l=Math.hypot(b[0]-a[0],b[1]-a[1]);if(d<=l){let t=l?d/l:0;return{x:a[0]+(b[0]-a[0])*t,y:a[1]+(b[1]-a[1])*t}}d-=l}let q=p.at(-1);return{x:q[0],y:q[1]}}
function count(kind){return buildings.filter(b=>kind==="farm"?b.kind==="farm":b.kind==="unit"&&category(b.type)===kind).length}
function farmPrice(){return Math.round(CONFIG.farm.baseCost*Math.pow(CONFIG.farm.costStep,count("farm")))}
function say(text){$("hint").textContent=text}
function ui(){ $("coins").textContent=coins;$("lives").textContent=lives;$("wave").textContent=`${wave}/${CONFIG.wavesPerMap}`;
 $("farmCount").textContent=`${count("farm")}/${CONFIG.limits.farm}`;$("weakCount").textContent=`${count("weak")}/${CONFIG.limits.weak}`;$("strongCount").textContent=`${count("strong")}/${CONFIG.limits.strong}`;
 $("mapLabel").textContent=`Карта ${mapIndex+1}: ${CONFIG.maps[mapIndex].name}`;say(CONFIG.maps[mapIndex].hint);
 $("start").disabled=running||ended||wave>=CONFIG.wavesPerMap;$("pause").disabled=!running;$("pause").textContent=paused?"Продолжить":"Пауза";$("speed").textContent=`Скорость x${speed}`;
 renderShop();renderMaps() }
function renderMaps(){let box=$("maps");box.replaceChildren();let label=document.createElement("b");label.textContent="Карты:";box.append(label);CONFIG.maps.forEach((m,i)=>{let b=document.createElement("button");b.className=i===mapIndex?"selected":"";b.disabled=i>unlocked||running;b.textContent=`${i+1}. ${m.name}${i>unlocked?" 🔒":""}`;b.onclick=()=>selectMap(i);box.append(b)})}
function renderShop(){let box=$("shop");box.querySelectorAll(".card").forEach(e=>e.remove());
 const add=(name,details,id,price,cat,lim)=>{let card=document.createElement("div");card.className="card";card.innerHTML=`<strong>${name}</strong><small>${details}</small>`;let b=document.createElement("button");let full=count(cat)>=lim,poor=coins<price;b.disabled=full||poor||ended;b.textContent=full?`Лимит ${lim}/${lim}`:poor?`${price} монет — не хватает ${price-coins}`:`Поставить · ${price}`;if(selected===id)b.classList.add("sel");b.onclick=()=>{selected=id;ui()};card.append(b);box.append(card)};
 add("🌾 Ферма","+5 монет каждые 3 сек · цена растёт на 20%", "farm",farmPrice(),"farm",CONFIG.limits.farm);
 CONFIG.units.forEach(u=>{let c=category(u);add(`${u.icon} ${u.name}`,`${c==="weak"?"Слабый":"Сильный"} · DPS ${dps(u)} · ${u.detect?"Детектор":u.splash?"Урон по области":"Радиус "+u.range}`,u.id,u.cost,c,CONFIG.limits[c])}) }
function selectMap(i){if(i>unlocked||running)return;mapIndex=i;wave=0;lives=CONFIG.baseLives;buildings=[];enemies=[];shots=[];ended=false;selected=null;ui();draw()}
function startWave(){wave++;queue=[];for(let i=0;i<7+wave*2;i++){let k="normal";if(mapIndex>=1&&i%4===2)k="fast";if(mapIndex>=1&&i%5===4)k="armored";if(mapIndex>=2&&i%3===1)k="invisible";queue.push(k)}running=true;paused=false;spawnWait=0;ui()}
function spawn(k){let d=CONFIG.enemies[k],scale=1+(wave-1)*.11+mapIndex*.08,hp=Math.round(d.hp*scale);enemies.push({kind:k,progress:0,x:path()[0][0],y:path()[0][1],hp,maxHp:hp,speed:d.speed*(1+mapIndex*.06),reward:d.reward,armor:d.armor,invisible:!!d.invisible,dead:false})}
function visible(e){return !e.invisible||buildings.some(b=>b.kind==="unit"&&b.type.detect&&dist(b,e)<=b.type.detect)}
function update(dt){if(paused||ended)return;let t=dt*speed;
 buildings.filter(b=>b.kind==="farm").forEach(f=>{f.timer-=t;if(f.timer<=0){f.timer+=CONFIG.farm.interval;coins+=CONFIG.farm.income;f.float=CONFIG.farm.income;f.floatTime=.8}});
 if(running&&queue.length){spawnWait-=t;if(spawnWait<=0){spawn(queue.shift());spawnWait=.72}}
 enemies.forEach(e=>{if(e.dead)return;e.progress+=e.speed*t;let p=pointAt(path(),e.progress);e.x=p.x;e.y=p.y;
  // Проходящие рядом мобы атакуют ферму вместо движения по маршруту.
  let farm=buildings.find(b=>b.kind==="farm"&&dist(b,e)<CONFIG.farm.range);if(farm){farm.hp-=12*t;if(farm.hp<=0){buildings=buildings.filter(b=>b!==farm)}e.progress-=e.speed*t;p=pointAt(path(),e.progress);e.x=p.x;e.y=p.y;return}
  if(e.progress>=pathLen(path())){e.dead=true;lives--;if(lives<=0)finish(false)}});
 buildings.filter(b=>b.kind==="farm"&&b.floatTime>0).forEach(f=>{f.floatTime-=t});
 buildings.filter(b=>b.kind==="unit").forEach(u=>{u.cooldown-=t;if(u.cooldown>0)return;let targets=enemies.filter(e=>!e.dead&&visible(e)&&dist(u,e)<=u.type.range).sort((a,b)=>b.progress-a.progress);if(!targets.length)return;u.cooldown=u.type.rate;shots.push({x:u.x,y:u.y,target:targets[0],damage:u.type.damage,splash:u.type.splash||0,color:u.type.color})});
 shots.forEach(s=>{if(!s.target||s.target.dead)return;s.x+=(s.target.x-s.x)*Math.min(1,t*8);s.y+=(s.target.y-s.y)*Math.min(1,t*8);if(dist(s,s.target)<10){let victims=s.splash?enemies.filter(e=>!e.dead&&visible(e)&&dist(e,s.target)<=s.splash):[s.target];victims.forEach(e=>{e.hp-=Math.max(1,s.damage-e.armor);if(e.hp<=0){e.dead=true;coins+=e.reward}});s.target=null}});
 enemies=enemies.filter(e=>!e.dead);shots=shots.filter(s=>s.target&&!s.target.dead);
 if(running&&!queue.length&&!enemies.length){running=false;coins+=CONFIG.waveBonus;if(wave>=CONFIG.wavesPerMap){if(mapIndex<2){unlocked=Math.max(unlocked,mapIndex+1);resultAction=()=>selectMap(mapIndex+1);show("Карта пройдена!",`Волна завершена, +${CONFIG.waveBonus} монет. Открыта следующая карта.`)}else{resultAction=reset;show("Победа!","Все три карты защищены.")}}}ui() }
function nearPath(p){let best=Infinity;for(let i=1;i<path().length;i++){let a=path()[i-1],b=path()[i],dx=b[0]-a[0],dy=b[1]-a[1],t=Math.max(0,Math.min(1,((p.x-a[0])*dx+(p.y-a[1])*dy)/(dx*dx+dy*dy)));best=Math.min(best,Math.hypot(p.x-a[0]-dx*t,p.y-a[1]-dy*t))}return best}
function draw(){ctx.clearRect(0,0,900,500);ctx.fillStyle="#203a32";ctx.fillRect(0,0,900,500);ctx.strokeStyle="#ffffff10";ctx.lineWidth=1;for(let x=0;x<=900;x+=50){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,500);ctx.stroke()}for(let y=0;y<=500;y+=50){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(900,y);ctx.stroke()}
 let p=path();ctx.lineCap="round";ctx.lineJoin="round";ctx.strokeStyle="#83785d";ctx.lineWidth=42;ctx.beginPath();p.forEach((q,i)=>i?ctx.lineTo(...q):ctx.moveTo(...q));ctx.stroke();ctx.strokeStyle="#c2b083";ctx.lineWidth=3;ctx.setLineDash([12,10]);ctx.stroke();ctx.setLineDash([]);
 buildings.forEach(b=>{if(b===hover&&b.kind==="unit"){ctx.beginPath();ctx.arc(b.x,b.y,b.type.range,0,7);ctx.fillStyle="#a4e4c522";ctx.fill();ctx.strokeStyle="#a4e4c588";ctx.stroke();if(b.type.detect){ctx.beginPath();ctx.arc(b.x,b.y,b.type.detect,0,7);ctx.setLineDash([6,5]);ctx.strokeStyle="#63d7d288";ctx.stroke();ctx.setLineDash([])}}ctx.beginPath();ctx.arc(b.x,b.y,18,0,7);ctx.fillStyle=b.kind==="farm"?"#daa84e":b.type.color;ctx.fill();ctx.strokeStyle="#10221d";ctx.lineWidth=3;ctx.stroke();ctx.font="20px sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(b.kind==="farm"?"🌾":b.type.icon,b.x,b.y);if(b.kind==="farm"){ctx.fillStyle="#251f17";ctx.fillRect(b.x-17,b.y-25,34,4);ctx.fillStyle="#79dc76";ctx.fillRect(b.x-17,b.y-25,34*Math.max(0,b.hp/CONFIG.farm.hp),4);if(b.floatTime>0){ctx.fillStyle="#fff";ctx.font="bold 16px sans-serif";ctx.fillText("+"+b.float,b.x,b.y-32)}}if(b===hover){ctx.fillStyle="#fff";ctx.font="12px sans-serif";ctx.fillText(`Продать +${Math.floor(b.cost*CONFIG.sellPercent)}`,b.x,b.y-34)}});
 enemies.forEach(e=>{ctx.save();ctx.globalAlpha=e.invisible&&!visible(e)?.15:1;let d=CONFIG.enemies[e.kind];ctx.beginPath();ctx.arc(e.x,e.y,13,0,7);ctx.fillStyle=d.color;ctx.fill();ctx.strokeStyle="#15221d";ctx.lineWidth=2;ctx.stroke();ctx.fillStyle="#fff";ctx.font="12px sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(e.invisible?"✦":"●",e.x,e.y);ctx.fillStyle="#382b29";ctx.fillRect(e.x-17,e.y-23,34,5);ctx.fillStyle=e.hp/e.maxHp>.5?"#67db70":"#f17864";ctx.fillRect(e.x-17,e.y-23,34*Math.max(0,e.hp/e.maxHp),5);ctx.restore()});shots.forEach(s=>{ctx.beginPath();ctx.arc(s.x,s.y,4,0,7);ctx.fillStyle=s.color;ctx.fill()});if(selected){ctx.fillStyle="#fff";ctx.font="14px sans-serif";ctx.fillText("Выберите свободную клетку",12,22)}}
function show(title,text){$("resultTitle").textContent=title;$("resultText").textContent=text;$("overlay").style.display="grid"}
function finish(win){if(ended)return;ended=true;running=false;resultAction=reset;show(win?"Победа!":"Поражение",win?"Волны пройдены!":"Жизни базы закончились.");ui()}
function reset(){$("overlay").style.display="none";mapIndex=0;unlocked=0;coins=CONFIG.startCoins;lives=CONFIG.baseLives;wave=0;buildings=[];enemies=[];shots=[];queue=[];running=paused=ended=false;selected=null;ui();draw()}
canvas.addEventListener("pointermove",ev=>{let r=canvas.getBoundingClientRect(),p={x:(ev.clientX-r.left)*900/r.width,y:(ev.clientY-r.top)*500/r.height};hover=buildings.find(b=>dist(b,p)<20)||null;draw()});
canvas.addEventListener("pointerdown",ev=>{if(ended)return;let r=canvas.getBoundingClientRect(),p={x:(ev.clientX-r.left)*900/r.width,y:(ev.clientY-r.top)*500/r.height},old=buildings.find(b=>dist(b,p)<20);if(old){coins+=Math.floor(old.cost*CONFIG.sellPercent);buildings=buildings.filter(b=>b!==old);selected=null;ui();draw();return}if(!selected)return;let x=Math.round(p.x/50)*50,y=Math.round(p.y/50)*50,pos={x,y};if(x<20||x>880||y<20||y>480||nearPath(pos)<35||buildings.some(b=>dist(b,pos)<35))return;
 if(selected==="farm"){let cost=farmPrice();if(coins<cost||count("farm")>=CONFIG.limits.farm)return;coins-=cost;buildings.push({id:nextId++,kind:"farm",x,y,cost,hp:CONFIG.farm.hp,timer:CONFIG.farm.interval,float:0,floatTime:0})}else{let type=CONFIG.units.find(u=>u.id===selected),cat=category(type);if(coins<type.cost||count(cat)>=CONFIG.limits[cat])return;coins-=type.cost;buildings.push({id:nextId++,kind:"unit",x,y,type,cost:type.cost,cooldown:0})}selected=null;ui();draw()});
$("start").onclick=()=>{if(!running&&!ended&&wave<CONFIG.wavesPerMap)startWave()};$("pause").onclick=()=>{if(running){paused=!paused;ui()}};$("speed").onclick=()=>{speed=speed===1?2:1;ui()};$("again").onclick=()=>{ $("overlay").style.display="none";if(resultAction)resultAction()};window.addEventListener("keydown",e=>{if(e.key==="Escape"){selected=null;ui();draw()}});
function frame(now){let dt=Math.min(.05,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(frame)}ui();draw();requestAnimationFrame(frame);
</script></body></html>
